basePath: /api
definitions:
  api.Status:
    properties:
      name:
        type: string
      stage:
        type: string
      version:
        type: string
    type: object
  dto.AddGameReq:
    properties:
      groupID:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.AddPlayerReq:
    properties:
      groupID:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.Claim:
    properties:
      player_id:
        type: string
      user_id:
        type: string
    type: object
  dto.CreateGroupReq:
    properties:
      name:
        type: string
      player_name:
        type: string
    required:
    - name
    - player_name
    type: object
  dto.DeleteRoundReq:
    properties:
      groupID:
        type: string
      roundID:
        type: string
      version:
        type: integer
    type: object
  dto.Game:
    properties:
      bgg_id:
        type: integer
      id:
        type: string
      name:
        type: string
      original:
        type: string
    type: object
  dto.GameActivity:
    properties:
      count:
        type: integer
      last_date:
        type: string
    type: object
  dto.Group:
    properties:
      id:
        type: string
      name:
        type: string
      owner:
        type: string
    type: object
  dto.Invite:
    properties:
      expires:
        type: string
      id:
        type: string
      revoked:
        type: boolean
    type: object
  dto.InvitePreview:
    properties:
      group_id:
        type: string
      name:
        type: string
    type: object
  dto.InviteResp:
    properties:
      expires:
        type: string
      id:
        type: string
      url:
        type: string
    type: object
  dto.JoinReq:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  dto.LoginReq:
    properties:
      code:
        type: string
      email:
        type: string
      group_token:
        type: string
    required:
    - code
    - email
    type: object
  dto.LoginResp:
    properties:
      email:
        type: string
      group_id:
        type: string
      id:
        type: string
    type: object
  dto.ManageReq:
    properties:
      action:
        type: string
      groupID:
        type: string
      target:
        type: string
      value:
        type: string
    required:
    - action
    type: object
  dto.Member:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  dto.Notification:
    properties:
      body:
        type: string
      created:
        type: string
      group_id:
        type: string
      id:
        type: string
      kind:
        type: string
      link:
        type: string
      read_at:
        type: string
      title:
        type: string
    type: object
  dto.NotificationPage:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.Notification'
        type: array
      unread:
        type: integer
    type: object
  dto.Page:
    properties:
      activity:
        additionalProperties:
          $ref: '#/definitions/dto.GameActivity'
        type: object
      games:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.Round'
        type: array
      players:
        type: integer
      stats:
        items:
          $ref: '#/definitions/dto.Stat'
        type: array
      total:
        type: integer
    type: object
  dto.Paginated-dto_RoundComment:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.RoundComment'
        type: array
      total:
        type: integer
    type: object
  dto.Player:
    properties:
      account:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.PublicPlayer:
    properties:
      name:
        type: string
      score:
        type: string
      winner:
        type: boolean
    type: object
  dto.PublicRound:
    properties:
      date:
        type: string
      game_name:
        type: string
      group_name:
        type: string
      memory:
        type: string
      mode:
        type: string
      outcome:
        type: string
      photos:
        items:
          type: string
        type: array
      players:
        items:
          $ref: '#/definitions/dto.PublicPlayer'
        type: array
      team_score:
        type: string
      teams:
        items:
          $ref: '#/definitions/dto.PublicTeam'
        type: array
    type: object
  dto.PublicTeam:
    properties:
      name:
        type: string
      players:
        items:
          type: string
        type: array
      score:
        type: string
      winner:
        type: boolean
    type: object
  dto.Recap:
    properties:
      from:
        type: string
      games:
        type: integer
      minutes:
        type: integer
      period:
        type: string
      photos:
        items:
          type: string
        type: array
      players:
        type: integer
      rounds:
        type: integer
      to:
        type: string
      top_game:
        type: string
      top_game_rounds:
        type: integer
      top_player:
        type: string
      top_plays:
        type: integer
    type: object
  dto.RestoreRoundReq:
    properties:
      groupID:
        type: string
      roundID:
        type: string
      version:
        type: integer
    type: object
  dto.Round:
    properties:
      author:
        type: string
      date:
        type: string
      deleted_at:
        type: string
      game_id:
        type: string
      id:
        type: string
      memory:
        type: string
      minutes:
        type: integer
      mode:
        type: string
      outcome:
        type: string
      photos:
        items:
          type: string
        type: array
      players:
        items:
          type: string
        type: array
      scores:
        additionalProperties:
          type: string
        type: object
      team_score:
        type: string
      teams:
        items:
          $ref: '#/definitions/dto.Team'
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
      winners:
        items:
          type: string
        type: array
    type: object
  dto.RoundComment:
    properties:
      author:
        type: string
      body:
        type: string
      created:
        type: string
      id:
        type: string
      parent_id:
        type: string
    type: object
  dto.RoundCommentBody:
    properties:
      body:
        type: string
      parent_id:
        type: string
    type: object
  dto.RoundShareStatus:
    properties:
      active:
        type: boolean
      created_at:
        type: string
    type: object
  dto.RoundShareToken:
    properties:
      created_at:
        type: string
      token:
        type: string
    type: object
  dto.SendCodeReq:
    properties:
      email:
        type: string
      group_token:
        type: string
      invite:
        type: string
    required:
    - email
    type: object
  dto.Snapshot:
    properties:
      claims:
        items:
          $ref: '#/definitions/dto.Claim'
        type: array
      games:
        items:
          $ref: '#/definitions/dto.Game'
        type: array
      group:
        $ref: '#/definitions/dto.Group'
      members:
        items:
          $ref: '#/definitions/dto.Member'
        type: array
      players:
        items:
          $ref: '#/definitions/dto.Player'
        type: array
    type: object
  dto.Stat:
    properties:
      game:
        type: string
      mode:
        type: string
      played:
        type: integer
      player:
        type: string
      samples:
        type: integer
      wins:
        type: integer
    type: object
  dto.Team:
    properties:
      id:
        type: string
      name:
        type: string
      players:
        items:
          type: string
        type: array
      score:
        type: string
      winner:
        type: boolean
    type: object
  dto.UploadPhotoResp:
    properties:
      id:
        type: string
    type: object
  dto.User:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-api_Status:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/api.Status'
      message: {}
    type: object
  ginutils.Ret-array_dto_Group:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.Group'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_dto_Invite:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.Invite'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_dto_Round:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.Round'
        type: array
      message: {}
    type: object
  ginutils.Ret-dto_Game:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Game'
      message: {}
    type: object
  ginutils.Ret-dto_Group:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Group'
      message: {}
    type: object
  ginutils.Ret-dto_InvitePreview:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.InvitePreview'
      message: {}
    type: object
  ginutils.Ret-dto_InviteResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.InviteResp'
      message: {}
    type: object
  ginutils.Ret-dto_LoginResp:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.LoginResp'
      message: {}
    type: object
  ginutils.Ret-dto_NotificationPage:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.NotificationPage'
      message: {}
    type: object
  ginutils.Ret-dto_Page:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Page'
      message: {}
    type: object
  ginutils.Ret-dto_Paginated-dto_RoundComment:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Paginated-dto_RoundComment'
      message: {}
    type: object
  ginutils.Ret-dto_Player:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Player'
      message: {}
    type: object
  ginutils.Ret-dto_PublicRound:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.PublicRound'
      message: {}
    type: object
  ginutils.Ret-dto_Recap:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Recap'
      message: {}
    type: object
  ginutils.Ret-dto_Round:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Round'
      message: {}
    type: object
  ginutils.Ret-dto_RoundComment:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.RoundComment'
      message: {}
    type: object
  ginutils.Ret-dto_RoundShareStatus:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.RoundShareStatus'
      message: {}
    type: object
  ginutils.Ret-dto_RoundShareToken:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.RoundShareToken'
      message: {}
    type: object
  ginutils.Ret-dto_Snapshot:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Snapshot'
      message: {}
    type: object
  ginutils.Ret-dto_User:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.User'
      message: {}
    type: object
  ginutils.Ret-string:
    properties:
      code:
        type: integer
      data:
        type: string
      message: {}
    type: object
info:
  contact: {}
  description: |-
    熟人小组对局日记的接口文档；路径相对 /api 挂载点。
    除图片读取外，所有接口返回 ginutils.Ret 包络：{code, data, message}；code 为稳定业务码，失败时 HTTP 状态同时表达语义。
  title: 又一局 API
  version: "1.0"
paths:
  /v1/auth/code:
    post:
      consumes:
      - application/json
      description: 向目标邮箱发送登录验证码；可携带试用邀请 invite 或小组邀请 group_token
      parameters:
      - description: 发送验证码请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 发送邮箱验证码
      tags:
      - Auth
  /v1/auth/group-invite:
    post:
      consumes:
      - application/json
      description: 无需登录，凭有效邀请仅返回小组 ID 与名称，不展示成员或记录
      parameters:
      - description: 邀请令牌
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.JoinReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_InvitePreview'
      summary: 查看小组邀请
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: 验证邮箱；携带 group_token 时原子注册并加入小组，否则新账号消费试用邀请
      parameters:
      - description: 登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_LoginResp'
      summary: 验证码登录
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: 撤销当前会话并清除会话 Cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - SessionCookie: []
      summary: 退出登录
      tags:
      - Auth
  /v1/groups:
    get:
      description: 返回当前账号加入的小组
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_dto_Group'
      security:
      - SessionCookie: []
      summary: 获取我的小组
      tags:
      - Group
    post:
      consumes:
      - application/json
      description: 创建小组与创建者自己的玩家档案，创建者成为组主与首位成员
      parameters:
      - description: 创建小组请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Group'
      security:
      - SessionCookie: []
      summary: 创建小组
      tags:
      - Group
  /v1/groups/{group}:
    get:
      description: 返回小组成员、玩家、桌游与待确认关联
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Snapshot'
      security:
      - SessionCookie: []
      summary: 获取小组详情
      tags:
      - Group
  /v1/groups/{group}/bgg/search:
    get:
      description: 外部桌游检索；授权未配置时返回明确不可用提示
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - SessionCookie: []
      summary: 搜索外部桌游
      tags:
      - Game
  /v1/groups/{group}/export:
    get:
      description: 仅组主可下载包含 JSON、CSV 与已关联照片的 ZIP
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - SessionCookie: []
      summary: 导出小组备份
      tags:
      - Group
  /v1/groups/{group}/games:
    post:
      consumes:
      - application/json
      description: 在小组内添加桌游，同组同名复用已有条目
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 添加桌游请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddGameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Game'
      security:
      - SessionCookie: []
      summary: 添加桌游
      tags:
      - Game
  /v1/groups/{group}/invites:
    get:
      description: 组主查看本组邀请记录，不返回明文令牌
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_dto_Invite'
      security:
      - SessionCookie: []
      summary: 获取小组邀请
      tags:
      - Group
    post:
      description: 组主生成七天有效的小组邀请，明文令牌仅返回一次
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_InviteResp'
      security:
      - SessionCookie: []
      summary: 生成小组邀请
      tags:
      - Group
  /v1/groups/{group}/manage:
    post:
      consumes:
      - application/json
      description: 组主或本人执行改名、转让、移除、撤销邀请、关联与审核玩家
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 小组操作请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ManageReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - SessionCookie: []
      summary: 修改小组与成员
      tags:
      - Group
  /v1/groups/{group}/photos:
    post:
      consumes:
      - multipart/form-data
      description: 上传单张不超过 2 MiB、长边不超过 1600px 的 JPEG/PNG/WebP，重编码后仅保存一张展示图；繁忙返回 503
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 图片文件
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UploadPhotoResp'
      security:
      - SessionCookie: []
      summary: 上传照片
      tags:
      - Photo
  /v1/groups/{group}/photos/{id}:
    get:
      description: 校验成员权限后流式返回统一展示图；兼容 size=thumb 参数，返回同一图片
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 照片 ID
        in: path
        name: id
        required: true
        type: string
      - description: 缩略图传 thumb
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - SessionCookie: []
      summary: 读取照片
      tags:
      - Photo
  /v1/groups/{group}/players:
    post:
      consumes:
      - application/json
      description: 在小组内添加昵称玩家，重名会被拒绝
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 添加玩家请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddPlayerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Player'
      security:
      - SessionCookie: []
      summary: 添加玩家
      tags:
      - Group
  /v1/groups/{group}/rounds:
    get:
      description: 按日期、桌游、玩家筛选对局，返回分页结果与战绩统计
      parameters:
      - description: 小组 ID
        in: path
        name: group
        required: true
        type: string
      - description: 开始日期
        in: query
        name: from
        type: string
      - description: 结束日期
        in: query
        name: to
        type: string
      - description: 桌游 ID
        in: query
        name: game
        type: string
      - description: 玩家 ID
        in: query
        name: player
        type: string
      - description: 搜索回忆
        in: query
        name: q
        type: string
      - description: individual/team/coop
        in: query
        name: mode
        type: string
      - description: win/loss/draw/unknown
        in: query
        name: outcome
